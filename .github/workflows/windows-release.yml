name: Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and release Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine next release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $highestMinor = 5
          $tags = gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name'

          foreach ($tag in $tags) {
            if ($tag -match '^0\.(\d+)$') {
              $highestMinor = [Math]::Max($highestMinor, [int]$Matches[1])
            }
          }

          $nextMinor = $highestMinor + 1
          "release_version=0.$nextMinor" >> $env:GITHUB_OUTPUT
          "app_version=0.$nextMinor.0" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Set application version
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: node -e "const fs = require('fs'); const path = 'src-tauri/tauri.conf.json'; const config = JSON.parse(fs.readFileSync(path, 'utf8')); config.version = process.env.APP_VERSION; fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');"

      - name: Build and publish Windows installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.release_version }}
          releaseName: ${{ steps.version.outputs.release_version }}
          releaseBody: |
            Sonora ${{ steps.version.outputs.release_version }} for Windows, built automatically from commit `${{ github.sha }}`.

            Download the `.exe` installer for the simplest setup, or use the `.msi` package for managed Windows installations.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: --target x86_64-pc-windows-msvc
